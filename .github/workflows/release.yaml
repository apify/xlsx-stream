name: Check & Release

on:
  # Push to master keeps the release-please PR up to date; merging that PR publishes to NPM
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  # Keeps a release PR open (version bump + changelog based on conventional commits).
  # Merging that PR creates the GitHub release and tag, and `release_created` becomes true.
  release_please:
    name: Release Please
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  lint_and_test:
    name: Lint and test
    uses: ./.github/workflows/check.yaml

  deploy:
    name: Publish to NPM
    needs: [lint_and_test, release_please]
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    # Necessary permissions for publishing to NPM with OIDC
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pre-release versions (e.g. 1.0.5-beta.1) go to the `beta` tag, the rest to `latest`.
      - name: Publish to NPM
        run: npm publish --tag ${{ contains(needs.release_please.outputs.version, '-') && 'beta' || 'latest' }}
